name: Build & push RunPod Serverless image

# RunPod의 "GitHub repo에서 자동 빌드" 기능이 불안정해서(Dockerfile/handler 인식 오류 반복)
# 대신 여기서 직접 빌드해 Docker Hub에 올리고, RunPod엔 완성된 이미지 주소만 준다.
on:
  push:
    branches: [master]
    paths:
      - "runpod_serverless/**"
      - "train/*.py"
      - "train/tokenizer258.json"
      - "token_to_notes.py"
  workflow_dispatch: {}  # Actions 탭에서 수동으로도 재실행 가능

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod_serverless/Dockerfile
          push: true
          # :latest만 쓰면 RunPod 쪽 인프라가 태그명이 안 바뀐다는 이유로 콜드스타트
          # 워커에도 예전 이미지 레이어를 재사용해버리는 캐싱 문제가 있었다(2026-08-10,
          # tie 병합 수정 배포 시 재현 확인 — Edit Endpoint Save/워커 재시작을 해도 반영
          # 안 됨). 커밋마다 고유한 :<sha> 태그를 같이 붙여서, 확실한 재배포가 필요할 땐
          # RunPod Container Image에 latest 대신 이 sha 태그를 넣으면 캐싱과 무관하게
          # 무조건 이번에 빌드한 이미지를 받는다.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/transnote-omr:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/transnote-omr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
